name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun tsc --noEmit

      - name: Run tests
        run: bun test tests/
        env:
          JWT_SECRET: ci-test-secret
          DEPLOY_API_KEY: ci-deploy-key

      - name: Health check build (client)
        run: bun build client/index.ts --outfile /dev/null --target bun

      - name: Health check build (server)
        run: bun build server/index.ts --outfile /dev/null --target bun
