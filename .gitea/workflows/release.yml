name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - platform: linux-x64
            target: bun-linux-x64
            ext: ''
          - platform: linux-arm64
            target: bun-linux-arm64
            ext: ''
          - platform: darwin-x64
            target: bun-darwin-x64
            ext: ''
          - platform: darwin-arm64
            target: bun-darwin-arm64
            ext: ''
          - platform: windows-x64
            target: bun-windows-x64
            ext: '.exe'

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test tests/
        env:
          JWT_SECRET: ci-test-secret
          DEPLOY_API_KEY: ci-deploy-key

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build client binary
        run: |
          mkdir -p dist

          bun build client/index.ts \
            --compile \
            --target ${{ matrix.target }} \
            --outfile dist/fileshare-${{ matrix.platform }}${{ matrix.ext }}

      - name: Compute SHA256
        id: sha256
        run: |
          SHA=$(sha256sum dist/fileshare-${{ matrix.platform }}${{ matrix.ext }} | awk '{print $1}')
          echo "SHA256=$SHA" >> $GITHUB_OUTPUT

      - name: Generate checksum file
        run: |
          echo "${{ steps.sha256.outputs.SHA256 }}  fileshare-${{ matrix.platform }}${{ matrix.ext }}" \
            > dist/fileshare-${{ matrix.platform }}${{ matrix.ext }}.sha256

      - name: Publish to server
        run: |
          curl -fsSL \
            -X POST "${{ vars.DEPLOY_SERVER }}/api/version" \
            -H "X-Deploy-Key: ${{ secrets.DEPLOY_API_KEY }}" \
            -F "version=${{ steps.version.outputs.VERSION }}" \
            -F "platform=${{ matrix.platform }}" \
            -F "sha256=${{ steps.sha256.outputs.SHA256 }}" \
            -F "file=@dist/fileshare-${{ matrix.platform }}${{ matrix.ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: fileshare-${{ matrix.platform }}
          path: |
            dist/fileshare-${{ matrix.platform }}${{ matrix.ext }}
            dist/fileshare-${{ matrix.platform }}${{ matrix.ext }}.sha256

  create-release:
    runs-on: ubuntu-latest
    needs: build-and-deploy

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded files
        run: find dist -type f

      - name: Create Gitea release
        uses: akkuman/gitea-release-action@v1
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          base_url: https://gitea.example.com
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Changes

            See commit history for details.

            ## Downloads

            Choose the binary matching your platform.

          files: |
            dist/*