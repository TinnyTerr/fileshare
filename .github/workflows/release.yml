name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - platform: linux-x64
            target: bun-linux-x64
            ext: ''
          - platform: linux-arm64
            target: bun-linux-arm64
            ext: ''
          - platform: darwin-x64
            target: bun-darwin-x64
            ext: ''
          - platform: darwin-arm64
            target: bun-darwin-arm64
            ext: ''
          - platform: windows-x64
            target: bun-windows-x64
            ext: '.exe'

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test tests/
        env:
          JWT_SECRET: ci-test-secret
          DEPLOY_API_KEY: ci-deploy-key

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build client binary
        run: |
          mkdir -p dist

          bun build client/index.ts \
            --compile \
            --target ${{ matrix.target }} \
            --define 'process.env.BAKED_SERVER="${{ vars.DEPLOY_SERVER }}"' \
            --define 'process.env.BAKED_VERSION="${{ steps.version.outputs.VERSION }}"' \
            --outfile dist/fileshare-${{ matrix.platform }}${{ matrix.ext }}

      - name: Install compression tools
        run: sudo apt-get install -y zstd lz4 p7zip-full

      - name: Compress all formats
        run: |
          BINARY="dist/fileshare-${{ matrix.platform }}${{ matrix.ext }}"
          BASE="dist/release/fileshare-${{ matrix.platform }}${{ matrix.ext }}"
          mkdir -p dist/release

          cp "$BINARY" "${BASE}"
          gzip  -9 -c "$BINARY"             > "${BASE}.gz"  || true
          bzip2 -9 -c "$BINARY"             > "${BASE}.bz2" || true
          xz    -9 -c "$BINARY"             > "${BASE}.xz"  || true
          zstd  --ultra -22 -q -c "$BINARY" > "${BASE}.zst" || true
          lz4   -9 -f -q "$BINARY" "${BASE}.lz4"            || true
          zip   -9j "${BASE}.zip" "$BINARY"                  || true
          7z a "${BASE}.7z" "$BINARY" >/dev/null             || true

      - name: Compute SHA256 (raw binary)
        id: sha256
        run: |
          SHA=$(sha256sum dist/fileshare-${{ matrix.platform }}${{ matrix.ext }} | awk '{print $1}')
          echo "SHA256=$SHA" >> $GITHUB_OUTPUT

      - name: Publish all variants to server
        run: |
          VER="${{ steps.version.outputs.VERSION }}"
          PLAT="${{ matrix.platform }}"
          SHA="${{ steps.sha256.outputs.SHA256 }}"
          BASE="dist/release/fileshare-${PLAT}${{ matrix.ext }}"

          upload() {
            local comp=$1 file=$2
            [ -f "$file" ] || return 0
            curl -fsSL \
              -X POST "${{ vars.DEPLOY_SERVER }}/api/version" \
              -H "X-Deploy-Key: ${{ secrets.DEPLOY_API_KEY }}" \
              -F "version=${VER}" \
              -F "platform=${PLAT}" \
              -F "sha256=${SHA}" \
              -F "compression=${comp}" \
              -F "file=@${file}"
          }

          upload raw "${BASE}"
          upload gz  "${BASE}.gz"
          upload bz2 "${BASE}.bz2"
          upload xz  "${BASE}.xz"
          upload zst "${BASE}.zst"
          upload lz4 "${BASE}.lz4"
          upload zip "${BASE}.zip"
          upload 7z  "${BASE}.7z"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/release/

  create-release:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    permissions:
      contents: write

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true

      - name: Fetch versioned install scripts
        run: |
          curl -fsSL "${{ vars.DEPLOY_SERVER }}/install.sh"  -o dist/release/install.sh
          curl -fsSL "${{ vars.DEPLOY_SERVER }}/install.ps1" -o dist/release/install.ps1

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: dist/release/*.zip
          body: |
            ## Changes

            See commit history for details.

            ## Install

            **Linux / macOS**
            ```sh
            curl -fsSL ${{ vars.DEPLOY_SERVER }}/install.sh | sh
            ```

            **Windows (PowerShell)**
            ```powershell
            irm ${{ vars.DEPLOY_SERVER }}/install.ps1 | iex
            ```

            **Update an existing install**
            ```sh
            fileshare update
            ```
