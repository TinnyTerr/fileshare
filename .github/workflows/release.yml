name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - platform: linux-x64
            target: bun-linux-x64
            ext: ''
          - platform: linux-arm64
            target: bun-linux-arm64
            ext: ''
          - platform: darwin-x64
            target: bun-darwin-x64
            ext: ''
          - platform: darwin-arm64
            target: bun-darwin-arm64
            ext: ''
          - platform: windows-x64
            target: bun-windows-x64
            ext: '.exe'

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test tests/
        env:
          JWT_SECRET: ci-test-secret
          DEPLOY_API_KEY: ci-deploy-key

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build client binary
        run: |
          mkdir -p dist

          bun build client/index.ts \
            --compile \
            --target ${{ matrix.target }} \
            --define 'process.env.BAKED_SERVER="${{ vars.DEPLOY_SERVER }}"' \
            --define 'process.env.BAKED_VERSION="${{ steps.version.outputs.VERSION }}"' \
            --outfile dist/fileshare-${{ matrix.platform }}${{ matrix.ext }}

      - name: Install compression tools
        run: sudo apt-get install -y zstd lz4 p7zip-full

      - name: Compress — compare algorithms, keep smallest
        id: compress
        run: |
          BINARY="dist/fileshare-${{ matrix.platform }}${{ matrix.ext }}"
          mkdir -p dist/release

          RAW_SIZE=$(stat -c%s "$BINARY")
          printf "raw:   %d bytes\n" "$RAW_SIZE"
          BEST_SIZE=$RAW_SIZE
          BEST_EXT=""

          # Updates BEST_SIZE/BEST_EXT if the probe file is smaller
          check() {
            local ext=$1 probe="/tmp/probe${1}" s
            s=$(stat -c%s "$probe" 2>/dev/null) || return
            printf "%-6s %d bytes\n" "${ext}:" "$s"
            [ "$s" -lt "$BEST_SIZE" ] && { BEST_SIZE=$s; BEST_EXT=$ext; }
          }

          gzip  -9 -c "$BINARY"                      > /tmp/probe.gz   2>/dev/null || true
          bzip2 -9 -c "$BINARY"                      > /tmp/probe.bz2  2>/dev/null || true
          xz    -9 -c "$BINARY"                      > /tmp/probe.xz   2>/dev/null || true
          zstd  --ultra -22 -q -c "$BINARY"          > /tmp/probe.zst  2>/dev/null || true
          lz4   -9 -f -q "$BINARY" /tmp/probe.lz4    2>/dev/null || true
          zip   -9j /tmp/probe.zip "$BINARY"          2>/dev/null || true
          rm -f /tmp/probe.7z && 7z a /tmp/probe.7z "$BINARY" >/dev/null 2>&1 || true

          echo "=== Compression results ==="
          check .gz; check .bz2; check .xz; check .zst; check .lz4; check .zip; check .7z

          RELEASE_NAME="fileshare-${{ matrix.platform }}${{ matrix.ext }}${BEST_EXT}"
          echo "--- Best: ${BEST_EXT:-raw} ($BEST_SIZE bytes) → $RELEASE_NAME ---"

          case "$BEST_EXT" in
            .gz)  gzip  -9 -c "$BINARY"             > "dist/release/${RELEASE_NAME}" ;;
            .bz2) bzip2 -9 -c "$BINARY"             > "dist/release/${RELEASE_NAME}" ;;
            .xz)  xz    -9 -c "$BINARY"             > "dist/release/${RELEASE_NAME}" ;;
            .zst) zstd  --ultra -22 -q -c "$BINARY" > "dist/release/${RELEASE_NAME}" ;;
            .lz4) lz4   -9 -f -q "$BINARY" "dist/release/${RELEASE_NAME}" ;;
            .zip) zip   -9j "dist/release/${RELEASE_NAME}" "$BINARY" ;;
            .7z)  7z a "dist/release/${RELEASE_NAME}" "$BINARY" >/dev/null ;;
            *)    cp "$BINARY" "dist/release/${RELEASE_NAME}" ;;
          esac

          echo "RELEASE_NAME=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Compute SHA256 (raw binary)
        id: sha256
        run: |
          SHA=$(sha256sum dist/fileshare-${{ matrix.platform }}${{ matrix.ext }} | awk '{print $1}')
          echo "SHA256=$SHA" >> $GITHUB_OUTPUT

      - name: Publish to server
        run: |
          curl -fsSL \
            -X POST "${{ vars.DEPLOY_SERVER }}/api/version" \
            -H "X-Deploy-Key: ${{ secrets.DEPLOY_API_KEY }}" \
            -F "version=${{ steps.version.outputs.VERSION }}" \
            -F "platform=${{ matrix.platform }}" \
            -F "sha256=${{ steps.sha256.outputs.SHA256 }}" \
            -F "file=@dist/fileshare-${{ matrix.platform }}${{ matrix.ext }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/release/

  create-release:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    permissions:
      contents: write

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: dist/release/*
          body: |
            ## Changes

            See commit history for details.

            ## Install

            **Linux / macOS**
            ```sh
            curl -fsSL ${{ vars.DEPLOY_SERVER }}/install.sh | sh
            ```

            **Windows (PowerShell)**
            ```powershell
            irm ${{ vars.DEPLOY_SERVER }}/install.ps1 | iex
            ```

            **Update an existing install**
            ```sh
            fileshare update
            ```
